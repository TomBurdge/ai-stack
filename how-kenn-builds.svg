<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1490" role="img"
     aria-labelledby="hkb-title hkb-desc" font-family="'Avenir Next', Avenir, 'Gill Sans', 'Segoe UI', sans-serif">
  <title id="hkb-title">How Kenn Builds — the standard development workflow</title>
  <desc id="hkb-desc">A vertical flowchart. Prerequisites: roborev post-commit hook
    armed with a Codex/GPT-5.x reviewer, and the superpowers skills installed.
    Phase 1, design together: the human engages with every brainstorm decision
    and design section; design is never delegated to agents. A side loop: when
    unsure, get an adversarial second opinion from a separate agent session on a
    different model family, for example Fable reviewing GPT-5.6-Sol or vice
    versa. Phase 2, write the spec: specs are written for agents, not humans.
    Phase 3, adversarial spec review: a separate agent session reviews the spec,
    looping back to revisions until findings converge. Phase 4, plan and
    subagent-driven implementation. A side loop: for plans over ten tasks, pause
    every five or so tasks to run roborev-fix; for smaller plans, close reviews
    at the end. Phase 5, the close-out gate: all roborev reviews closed, and
    superpowers documents converted to durable docs or deleted. Phase 6, make
    the work durable: durable artifacts state their invariants directly and do
    not depend on planning history. Then explain the change, open the pull
    request, and own the merge. A thick amber left edge on a phase means the
    human leans in hard; a thin edge means agents run it with human
    checkpoints.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a2"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b452"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5fd4c0"/>
    </marker>
    <linearGradient id="engage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b452"/>
      <stop offset="1" stop-color="#6b5a34"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="940" height="1490" rx="18" fill="#14171c"/>
  <rect x="1.5" y="1.5" width="937" height="1487" rx="17" fill="none" stroke="#2a303a" stroke-width="1.5"/>

  <!-- header -->
  <text x="64" y="78" fill="#e7e9ee" font-size="34" font-weight="700" letter-spacing="0.5">How Kenn Builds</text>
  <text x="64" y="106" fill="#99a1ad" font-size="15">Spec-driven development with agents — and a human who never leaves the room.</text>

  <!-- legend -->
  <g font-size="12.5">
    <rect x="640" y="52" width="14" height="14" rx="3" fill="#f0b452"/>
    <text x="662" y="63.5" fill="#c6cbd4">human leans in</text>
    <rect x="640" y="76" width="14" height="14" rx="3" fill="#5fd4c0"/>
    <text x="662" y="87.5" fill="#c6cbd4">agents run it, human checkpoints</text>
    <line x1="640" y1="107" x2="654" y2="107" stroke="#8b93a2" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="662" y="111.5" fill="#c6cbd4">loop until it converges</text>
  </g>

  <!-- prerequisites banner -->
  <g>
    <rect x="64" y="136" width="812" height="64" rx="10" fill="#1b1f26" stroke="#f27878" stroke-width="1.5"/>
    <text x="88" y="162" fill="#f27878" font-size="12" font-weight="700" letter-spacing="2">PREREQUISITES — NO WORK STARTS WITHOUT THESE</text>
    <text x="88" y="184" fill="#dfe2e8" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace">roborev post-commit hook armed (Codex / GPT-5.x reviewing)  ·  superpowers installed</text>
  </g>
  <line x1="330" y1="200" x2="330" y2="236" stroke="#8b93a2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- phase 1: design together -->
  <g>
    <rect x="64" y="240" width="532" height="128" rx="10" fill="#1b1f26" stroke="#333a46"/>
    <rect x="64" y="240" width="9" height="128" rx="4.5" fill="#f0b452"/>
    <circle cx="106" cy="272" r="16" fill="none" stroke="#f0b452" stroke-width="2"/>
    <text x="106" y="277.5" fill="#f0b452" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="134" y="278" fill="#e7e9ee" font-size="19" font-weight="700">Design together</text>
    <text x="92" y="308" fill="#c6cbd4" font-size="13.5">Engage with every brainstorm decision and design section yourself.</text>
    <text x="92" y="328" fill="#c6cbd4" font-size="13.5">Design is never delegated to agents — delegated design is slop.</text>
    <text x="92" y="352" fill="#f0b452" font-size="12" font-weight="700" letter-spacing="1.5">MAXIMIZE HUMAN ENGAGEMENT HERE</text>
  </g>

  <!-- adversarial second-opinion loop (attached to 1 and 3) -->
  <g>
    <rect x="640" y="252" width="236" height="216" rx="10" fill="#171b21" stroke="#f0b452" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="660" y="280" fill="#f0b452" font-size="12" font-weight="700" letter-spacing="1.5">WHEN UNSURE</text>
    <text x="660" y="304" fill="#dfe2e8" font-size="13.5">Adversarial second opinion:</text>
    <text x="660" y="324" fill="#c6cbd4" font-size="13">a separate agent session on a</text>
    <text x="660" y="342" fill="#c6cbd4" font-size="13">different model family judges the</text>
    <text x="660" y="360" fill="#c6cbd4" font-size="13">decision or design section.</text>
    <text x="660" y="390" fill="#dfe2e8" font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Fable &lt;-&gt; GPT-5.6-Sol</text>
    <text x="660" y="416" fill="#99a1ad" font-size="12">Applies to brainstorming decisions</text>
    <text x="660" y="433" fill="#99a1ad" font-size="12">(1) and to spec review (3).</text>
    <line x1="596" y1="304" x2="640" y2="304" stroke="#f0b452" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#arr-amber)" marker-end="url(#arr-amber)"/>
  </g>
  <line x1="330" y1="368" x2="330" y2="404" stroke="#8b93a2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- phase 2: write the spec -->
  <g>
    <rect x="64" y="408" width="532" height="104" rx="10" fill="#1b1f26" stroke="#333a46"/>
    <rect x="64" y="408" width="4" height="104" rx="2" fill="#5fd4c0"/>
    <circle cx="106" cy="440" r="16" fill="none" stroke="#5fd4c0" stroke-width="2"/>
    <text x="106" y="445.5" fill="#5fd4c0" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="134" y="446" fill="#e7e9ee" font-size="19" font-weight="700">Write the spec</text>
    <text x="92" y="476" fill="#c6cbd4" font-size="13.5">Specs are written for agents, not humans. If you engaged with the</text>
    <text x="92" y="496" fill="#c6cbd4" font-size="13.5">design, you do not need to line-read the document yourself.</text>
  </g>
  <line x1="330" y1="512" x2="330" y2="548" stroke="#8b93a2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- phase 3: adversarial spec review -->
  <g>
    <rect x="64" y="552" width="532" height="112" rx="10" fill="#1b1f26" stroke="#333a46"/>
    <rect x="64" y="552" width="4" height="112" rx="2" fill="#5fd4c0"/>
    <circle cx="106" cy="584" r="16" fill="none" stroke="#5fd4c0" stroke-width="2"/>
    <text x="106" y="589.5" fill="#5fd4c0" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="134" y="590" fill="#e7e9ee" font-size="19" font-weight="700">Adversarial spec review</text>
    <text x="92" y="620" fill="#c6cbd4" font-size="13.5">A separate agent session reviews the spec and reports findings.</text>
    <text x="92" y="640" fill="#c6cbd4" font-size="13.5">Fix, re-review, repeat.</text>
    <!-- convergence loop back to 2 -->
    <path d="M 596 608 C 632 608, 632 460, 596 460" fill="none" stroke="#5fd4c0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-teal)"/>
    <text x="648" y="540" fill="#5fd4c0" font-size="11.5">revise until converged</text>
  </g>
  <line x1="330" y1="664" x2="330" y2="700" stroke="#8b93a2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- phase 4: plan + subagent-driven development -->
  <g>
    <rect x="64" y="704" width="532" height="128" rx="10" fill="#1b1f26" stroke="#333a46"/>
    <rect x="64" y="704" width="4" height="128" rx="2" fill="#5fd4c0"/>
    <circle cx="106" cy="736" r="16" fill="none" stroke="#5fd4c0" stroke-width="2"/>
    <text x="106" y="741.5" fill="#5fd4c0" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="134" y="742" fill="#e7e9ee" font-size="19" font-weight="700">Plan, then subagent-driven implementation</text>
    <text x="92" y="772" fill="#c6cbd4" font-size="13.5">Convert the converged spec into an implementation plan, then</text>
    <text x="92" y="792" fill="#c6cbd4" font-size="13.5">execute it with a fresh implementer and reviewer per task.</text>
    <text x="92" y="816" fill="#99a1ad" font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">writing-plans → subagent-driven-development</text>
  </g>

  <!-- roborev cadence loop -->
  <g>
    <rect x="640" y="704" width="236" height="170" rx="10" fill="#171b21" stroke="#5fd4c0" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="660" y="732" fill="#5fd4c0" font-size="12" font-weight="700" letter-spacing="1.5">REVIEW CADENCE</text>
    <text x="660" y="756" fill="#dfe2e8" font-size="13.5">Plan &gt; 10 tasks?</text>
    <text x="660" y="776" fill="#c6cbd4" font-size="13">Pause every ~5 tasks and run</text>
    <text x="660" y="794" fill="#dfe2e8" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, monospace">roborev-fix</text>
    <text x="660" y="814" fill="#c6cbd4" font-size="13">so reviews never pile up.</text>
    <text x="660" y="842" fill="#99a1ad" font-size="12">≤ 10 tasks: closing out at the</text>
    <text x="660" y="859" fill="#99a1ad" font-size="12">end is fine.</text>
    <line x1="596" y1="768" x2="640" y2="768" stroke="#5fd4c0" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#arr-teal)" marker-end="url(#arr-teal)"/>
  </g>
  <line x1="330" y1="832" x2="330" y2="868" stroke="#8b93a2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- phase 5: close-out gate -->
  <g>
    <rect x="64" y="872" width="532" height="150" rx="10" fill="#1b1f26" stroke="#f27878" stroke-width="1.5"/>
    <rect x="64" y="872" width="6" height="150" rx="3" fill="#f0b452"/>
    <circle cx="106" cy="904" r="16" fill="none" stroke="#f27878" stroke-width="2"/>
    <text x="106" y="909.5" fill="#f27878" font-size="16" font-weight="700" text-anchor="middle">5</text>
    <text x="134" y="910" fill="#e7e9ee" font-size="19" font-weight="700">Close-out gate</text>
    <text x="92" y="940" fill="#f27878" font-size="12" font-weight="700" letter-spacing="1.5">BOTH BOXES CHECKED BEFORE ANY PR</text>
    <rect x="92" y="954" width="13" height="13" rx="3" fill="none" stroke="#c6cbd4" stroke-width="1.5"/>
    <text x="115" y="965.5" fill="#dfe2e8" font-size="13.5">Every roborev review is closed out.</text>
    <rect x="92" y="980" width="13" height="13" rx="3" fill="none" stroke="#c6cbd4" stroke-width="1.5"/>
    <text x="115" y="991.5" fill="#dfe2e8" font-size="13.5">Superpowers specs and plans converted to durable docs — or deleted.</text>
    <text x="115" y="1010" fill="#99a1ad" font-size="12">They land in main only with a reason, e.g. a follow-up PR needs them.</text>
  </g>
  <line x1="330" y1="1022" x2="330" y2="1058" stroke="#8b93a2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- phase 6: durability gate -->
  <g>
    <rect x="64" y="1062" width="532" height="180" rx="10" fill="#1b1f26" stroke="#f0b452" stroke-width="1.5"/>
    <rect x="64" y="1062" width="6" height="180" rx="3" fill="#f0b452"/>
    <circle cx="106" cy="1094" r="16" fill="none" stroke="#f0b452" stroke-width="2"/>
    <text x="106" y="1099.5" fill="#f0b452" font-size="16" font-weight="700" text-anchor="middle">6</text>
    <text x="134" y="1100" fill="#e7e9ee" font-size="19" font-weight="700">Make the work durable</text>
    <text x="92" y="1130" fill="#c6cbd4" font-size="13.5">Durable artifacts state their invariants directly in domain language.</text>
    <text x="92" y="1150" fill="#c6cbd4" font-size="13.5">Use stable paths, role-based runbooks, and meaningful metadata.</text>
    <text x="92" y="1174" fill="#f0b452" font-size="12" font-weight="700" letter-spacing="1.3">PLANNING MAY POINT TO DURABLE ARTIFACTS — NEVER THE REVERSE</text>
    <rect x="92" y="1190" width="13" height="13" rx="3" fill="none" stroke="#c6cbd4" stroke-width="1.5"/>
    <text x="115" y="1201.5" fill="#dfe2e8" font-size="13">Delete the planning tree: the repository still explains itself.</text>
    <rect x="92" y="1214" width="13" height="13" rx="3" fill="none" stroke="#c6cbd4" stroke-width="1.5"/>
    <text x="115" y="1225.5" fill="#dfe2e8" font-size="13">Default branch alone is enough to operate and recover the system.</text>
  </g>
  <line x1="330" y1="1242" x2="330" y2="1278" stroke="#8b93a2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- terminal: explain, open, and own -->
  <g>
    <rect x="64" y="1282" width="532" height="52" rx="26" fill="#1d2a20" stroke="#7fd98f" stroke-width="2"/>
    <text x="330" y="1314" fill="#7fd98f" font-size="17" font-weight="700" text-anchor="middle">Explain the change · open the PR · own the merge</text>
  </g>

  <!-- engagement gauge annotation -->
  <g>
    <rect x="27" y="240" width="6" height="1002" rx="3" fill="url(#engage)"/>
    <text x="20" y="750" fill="#99a1ad" font-size="11.5" letter-spacing="2" transform="rotate(-90 20 750)" text-anchor="middle">HUMAN ENGAGEMENT</text>
  </g>

  <!-- footer -->
  <text x="64" y="1380" fill="#99a1ad" font-size="12.5">Thick amber edge = you lean in hard. Thin teal edge = agents run it; you hold the checkpoints.</text>
  <text x="64" y="1402" fill="#99a1ad" font-size="12.5">Principles behind this page: the Zen of Kenn. Weekly rhythm: the weekly workflow doc.</text>
  <text x="64" y="1446" fill="#5a6270" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace">kenn · handbook/dev · how-kenn-builds</text>
</svg>
